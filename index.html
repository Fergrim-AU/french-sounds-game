<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Французские звуки: карточная игра</title>
<style>
:root{--bg:#f6f2ea;--fg:#1d1d1b;--mut:#6b675e;--pn:#fffdf8;--bd:#d9d2c3;--ac:#d6334b;--felt:#2f7a4f;--felt2:#27683f;--btn:#1d1d1b;--btnf:#fffdf8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#161a17;--fg:#ece8dd;--mut:#9a968b;--pn:#1f2521;--bd:#333b35;--felt:#1f5a39;--felt2:#194a2f;--btn:#ece8dd;--btnf:#161a17;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#161a17;--fg:#ece8dd;--mut:#9a968b;--pn:#1f2521;--bd:#333b35;--felt:#1f5a39;--felt2:#194a2f;--btn:#ece8dd;--btnf:#161a17;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
main{max-width:1000px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.mut{color:var(--mut);font-size:13px}
.err{background:#fde8ea;color:#8a1020;border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:14px}
.b{background:var(--btn);color:var(--btnf);border:0;border-radius:10px;padding:10px 16px;font-size:15px;font-weight:600;cursor:pointer}
.b:disabled{opacity:.4;cursor:default}
.b.s{padding:6px 10px;font-size:13px;background:var(--ac);color:#fff}
.b.l{background:transparent;color:var(--mut);border:1px solid var(--bd);font-weight:400;padding:6px 10px;font-size:13px}
input{font-size:16px;padding:10px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--pn);color:var(--fg);width:100%;margin:6px 0}
.box{background:var(--pn);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:12px}
.code{font-size:44px;font-weight:800;letter-spacing:8px;margin:4px 0}
.card{width:84px;height:122px;border-radius:9px;border:2px solid #252733;overflow:hidden;background:#fcfffc;flex:none;user-select:none}
.card img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.card.mini{width:40px;height:58px;border-width:1.5px;border-radius:5px}
.card.sel{outline:3px solid #ffd54f;outline-offset:2px}
.card.mine{cursor:grab;touch-action:none}
.card.pick{cursor:pointer;touch-action:manipulation}
.ghost{position:fixed;z-index:99;pointer-events:none;opacity:.85}
.center{background:var(--felt);background-image:linear-gradient(var(--felt2),var(--felt));border-radius:14px;padding:14px;display:flex;gap:20px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px;color:#fff}
.center .lb{font-size:12px;margin-bottom:4px;opacity:.85}
.row{display:flex;gap:10px;align-items:flex-end}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-bottom:12px}
.panel{background:var(--pn);border:1px solid var(--bd);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}
.panel.me{border-color:var(--ac)}
.ph{display:flex;justify-content:space-between;gap:8px;align-items:center}
.pr{display:flex;gap:8px;align-items:flex-start}
.mh{display:flex;gap:4px;flex-wrap:wrap}
.hand{min-height:136px;display:flex;gap:8px;flex-wrap:wrap;padding:10px;border:2px dashed var(--bd);border-radius:12px;margin-bottom:10px;align-content:flex-start}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.zone{background-color:#fff;background-size:cover;background-position:center;border:1px solid var(--bd);border-radius:12px;aspect-ratio:3/2;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start}
.card.zc{width:58px;height:84px}
h2{font-size:15px;margin:10px 0 6px}
.banner{background:#ffd54f;color:#1d1d1b;border-radius:10px;padding:10px 12px;margin-bottom:12px;font-weight:600}
@media (max-width:640px){.fields{grid-template-columns:1fr}}
@media (max-width:520px){.card{width:70px;height:101px}.card.mini{width:40px;height:58px}}
</style>
</head>

  for(var i=2;i<arguments.length;i++){var c=arguments[i];if(Array.isArray(c))c.forEach(function(x){if(x!=null)e.append(x)});else if(c!=null&&c!==false)e.append(c)}return e}
var ws=null,conn=false,retry=0,hb=null;
function send(o){if(ws&&ws.readyState===1)ws.send(JSON.stringify(o))}
function connectWS(){
  ws=new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host);
  ws.onopen=function(){conn=true;retry=0;if(me.code&&me.tok)send({t:"resume",code:me.code,tok:me.tok});clearInterval(hb);hb=setInterval(function(){send({t:"ping"})},25000);render()};
  ws.onclose=function(){conn=false;clearInterval(hb);render();setTimeout(connectWS,Math.min(8000,1000*(++retry)))};
  ws.onmessage=function(e){
    var m;try{m=JSON.parse(e.data)}catch(x){return}
    if(m.t==="error"){err=m.msg;if(m.fatal){me={};persist();sess=null;players={};hands={};sel=null}render()}
    else if(m.t==="joined"){me={role:m.role,code:m.code,id:m.id,tok:m.tok,nick:m.nick};persist();err=""}
    else if(m.t==="state"){err="";apply(m.state)}
  };
}
function apply(st){
  sess={status:st.status,bonusOn:!!st.bonusOn,center:st.center,deck:st.deckN?Array(st.deckN-1).fill(-1).concat([st.top]):[]};
  players={};hands={};
  st.players.forEach(function(p){players[p.id]={nick:p.nick,placed:p.placed};if(st.status==="playing")hands[p.id]={cards:p.cards,bonus:p.bonus}});
  render();
}
function createGame(b){send({t:"create",bonus:!!b})}
function join(){
  var code=form.code.trim(),nick=form.nick.trim();
  if(!nick||!/^\d{4}$/.test(code)){err="Введите никнейм и четырёхзначный код игры.";return render()}
  send({t:"join",code:code,nick:nick});
}
function start(){send({t:"start"})}
function give(pid){if(sel===null)return;send({t:"give",sel:sel,to:pid});sel=null;render()}
function leave(){send({t:"leave"});me={};persist();sess=null;players={};hands={};sel=null;err="";render()}

function hit(c,b){var s=SND[c],bs=BON[b];for(var i=0;i<bs.length;i++)if(s.indexOf(bs[i])>=0)return true;return false}
function placedOf(p){var r=[];[0,1,2,3].forEach(function(z){((p.placed&&p.placed[z])||[]).forEach(function(c){r.push(c)})});return r}
function score(pid){var p=players[pid],hd=hands[pid];if(!p||!hd)return 0;return placedOf(p).reduce(function(s,c){return s+(sess&&sess.bonusOn&&hd.bonus!=null&&hit(c,hd.bonus)?2:1)},0)}
function over(){return !!sess&&sess.status==="playing"&&!sess.deck.length&&!sess.center.length}
function place(id,z){send({t:"place",id:id,zone:z})}

function flip(id){if(flipped[id])delete flipped[id];else flipped[id]=1;render()}

function card(id,o){
  o=o||{};var up=(o.mine||o.hf)&&flipped[id];
  var e=h("div",{class:"card"+(o.mini?" mini":"")+(o.sel?" sel":"")+(o.mine?" mine":"")+(o.pick?" pick":"")+(o.zc?" zc":"")},
    h("img",{src:(up?IM.txt:IM.pic)[id],draggable:"false",alt:"Карточка"}));
  if(o.mine)drag(e,id);
  return e;
}
function bonus(b,mini){return h("div",{class:"card"+(mini?" mini":"")},h("img",{src:IM.bon[b],draggable:"false",alt:"Бонусная карта"}))}
function drag(el,id){
  el.addEventListener("pointerdown",function(e){
    if(e.button>0)return;
    var sx=e.clientX,sy=e.clientY,ghost=null,moved=false;
    function mv(ev){
      if(!moved&&Math.hypot(ev.clientX-sx,ev.clientY-sy)>6){moved=true;ghost=el.cloneNode(true);ghost.classList.add("ghost");document.body.appendChild(ghost)}
      if(ghost){ghost.style.left=(ev.clientX-40)+"px";ghost.style.top=(ev.clientY-58)+"px"}
    }
    function up(ev){
      document.removeEventListener("pointermove",mv);document.removeEventListener("pointerup",up);document.removeEventListener("pointercancel",up);
      if(!moved){flip(id);return}
      ghost.remove();
      var t=document.elementFromPoint(ev.clientX,ev.clientY),z=t&&t.closest("[data-zone]");
      if(z)place(id,+z.getAttribute("data-zone"));
    }
    document.addEventListener("pointermove",mv);document.addEventListener("pointerup",up);document.addEventListener("pointercancel",up);
  });
}

var lc={k:null,t:0,prev:null};
function hostClick(key,id){
  var now=Date.now();
  if(lc.k===key&&now-lc.t<400){sel=lc.prev;lc={k:null,t:0,prev:null};flip(id);return}
  lc={k:key,t:now,prev:sel};sel=(sel===key)?null:key;render();
}
function panel(pid){
  var p=players[pid],hd=hands[pid],sc=score(pid),pset={};placedOf(p).forEach(function(c){pset[c]=1});
  var hand=hd?hd.cards.filter(function(c){return !pset[c]}):[];
  var scores=Object.keys(players).map(score),mx=Math.max.apply(null,scores);
  var win=over()&&sc===mx&&mx>0;
  return h("div",{class:"panel"+(pid===me.id?" me":"")},
    h("div",{class:"ph"},h("b",{},(win?"🏆 ":"")+p.nick),h("span",{},sc+" оч.")),
    h("div",{class:"pr"},hd&&sess.bonusOn&&hd.bonus!=null?bonus(hd.bonus,true):null,h("div",{class:"mh"},hand.map(function(c){return card(c,{mini:true})}))),
    h("div",{class:"mut"},"Карточек: "+hand.length+" · на поле: "+placedOf(p).length),
    me.role==="host"&&sel!==null&&sess.status==="playing"?h("button",{class:"b s",onclick:function(){give(pid)}},"Передать"):null);
}
function lobbyList(){
  var ids=Object.keys(players);
  return h("div",{class:"box"},h("div",{class:"mut"},"Код игры"),h("div",{class:"code"},me.code),h("div",{class:"mut"},sess.bonusOn?"Режим: с бонусными картами":"Режим: без бонусных карт"),
    h("div",{class:"mut"},"Игроки ("+ids.length+" из 10, можно играть и одному):"),
    h("ul",{},ids.map(function(i){return h("li",{},players[i].nick)})),
    me.role==="host"?h("button",{class:"b",disabled:ids.length<1||ids.length>10?"true":null,onclick:start},"Начать игру"):h("div",{class:"mut"},"Ждём, когда ведущий начнёт игру."));
}
function gameView(){
  var out=[],host=me.role==="host",top=sess.deck.length?sess.deck[sess.deck.length-1]:null;
  if(over())out.push(h("div",{class:"banner"},"Колода закончилась. Побеждает игрок с наибольшим числом очков (🏆)."));
  var cen=h("div",{class:"center"},
    h("div",{},h("div",{class:"lb"},"Колода: "+sess.deck.length+(host&&top!==null?" (верхняя карта)":"")),
      top!==null?card(top,{pick:host,hf:host,sel:sel==="deck"}):h("div",{class:"card"})),
    h("div",{},h("div",{class:"lb"},"Открытые карточки"),h("div",{class:"row"},sess.center.map(function(c,i){return card(c,{pick:host,hf:host,sel:sel===i})}))));
  if(host){
    var kids=cen.querySelectorAll(".card");
    if(top!==null)kids[0].addEventListener("click",function(){hostClick("deck",top)});
    sess.center.forEach(function(c,i){kids[1+i].addEventListener("click",function(){hostClick(i,c)})});
  }
  out.push(cen);
  if(host)out.push(h("p",{class:"mut"},"Выберите карточку у колоды, затем нажмите «Передать» у нужного игрока. Двойной клик по карточке переворачивает её."));
  out.push(h("div",{class:"grid"},Object.keys(players).filter(function(i){return hands[i]}).map(panel)));
  if(me.role==="player"&&hands[me.id]&&players[me.id]){
    var p=players[me.id],pset={};placedOf(p).forEach(function(c){pset[c]=1});
    out.push(h("h2",{},"Ваши карточки (нажмите, чтобы перевернуть; перетащите на поле)"));
    out.push(h("div",{class:"hand"},hands[me.id].cards.filter(function(c){return !pset[c]}).map(function(c){return card(c,{mine:true})})));
    out.push(h("h2",{},"Ваше игровое поле"));
    out.push(h("div",{class:"fields"},[0,1,2,3].map(function(z){return h("div",{class:"zone","data-zone":z,style:'background-image:url("'+IM.zone[z]+'")'},((p.placed&&p.placed[z])||[]).map(function(c){return card(c,{mine:true,zc:true})}))})));
  }
  return out;
}
function render(){
  $app.textContent="";
  $app.append(h("div",{class:"top"},h("h1",{},"Французские звуки"),
    me.code?h("div",{class:"row"},h("span",{class:"mut"},(me.role==="host"?"Ведущий":"Игрок")+" · код "+me.code),h("button",{class:"b l",onclick:leave},"Выйти")):null));
  if(err)$app.append(h("div",{class:"err"},err));
  if(!conn){$app.append(h("div",{class:"box"},"Подключение к серверу… Если хостинг «спал», это может занять около минуты."));return}
  if(!me.code){
    $app.append(h("div",{class:"box"},h("b",{},"Я ведущий"),h("p",{class:"mut"},"Создайте игру и сообщите игрокам четырёхзначный код."),h("div",{class:"row",style:"flex-wrap:wrap"},h("button",{class:"b",onclick:function(){createGame(true)}},"Создать игру с бонусными картами"),h("button",{class:"b",onclick:function(){createGame(false)}},"Создать игру без бонусных карт"))));
    $app.append(h("div",{class:"box"},h("b",{},"Я игрок"),
      h("input",{placeholder:"Никнейм",maxlength:"16",value:form.nick,oninput:function(e){form.nick=e.target.value}}),
      h("input",{placeholder:"Код игры (4 цифры)",inputmode:"numeric",maxlength:"4",value:form.code,oninput:function(e){form.code=e.target.value}}),
      h("button",{class:"b",onclick:join},"Войти в игру")));
    
    return;
  }
  if(!sess){$app.append(h("p",{class:"mut"},"Загрузка игры…"));return}
  if(sess.status==="lobby")$app.append(lobbyList());else gameView().forEach(function(x){$app.append(x)});
}
render();
connectWS();
})();
</script>
</body>
</html>
